<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="{{ site.theme_color }}" />
  <link rel="icon" type="image/png" href="{{ '/images/logo.png' | relative_url }}" />
  <title>
    {% if page.url == '/' %}{{ site.title }}{% else %}{{ page.title }} | {{ site.title }}{% endif %}
  </title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" />
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
  {% if page.custom_css %}
  <link rel="stylesheet" href="{{ page.custom_css | relative_url }}" />
  {% endif %}
</head>

<body class="page {{ layout.bodyClass }}">
  {% include header.html %}
  <main>{{ content }}</main>
  {% include footer.html %}
  <script src="{{ '/assets/js/scripts.js' | relative_url }}"></script>
</body>

</html>
