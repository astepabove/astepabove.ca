# Theme settings
theme_color: "#0a2540" # Deep Navy Blue
accent_color: "#20a4f3" # High-visibility Blue/Teal

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-toc

permalink: pretty

collections:
  services:
    output: true
    sort_by: weight
    permalink: /services/:name/

defaults:
  - scope:
      path: ""
      type: "services"
    values:
      layout: "service"

exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
